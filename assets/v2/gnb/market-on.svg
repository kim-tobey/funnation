.heart{transform-origin:17.17px 16.66px;animation:beat 1.2s ease-in-out infinite alternate}
.sp{transform-box:fill-box;transform-origin:center;opacity:0;animation:tw 2.4s ease-in-out infinite}
.sp2{animation-delay:1.2s}
@keyframes glow{from{opacity:.35;transform:scale(.85)}to{opacity:.95;transform:scale(1.12)}}
@keyframes beat{from{transform:scale(.94)}to{transform:scale(1.08)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}60%{opacity:0;transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.glow,.heart,.sp{animation:none}.sp{opacity:0}}
</style>
