<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="-0.5 -0.5 27 27" fill="none" overflow="visible">
<!-- 잡화점 · 구독 중 — 하트가 반짝반짝(빛이 커졌다 작아지고 하트가 살짝 커짐, 옆 작은 별 두 개가 번갈아 반짝, 2.4초 반복). 움직임 줄이기 설정이면 멈춤. 원본 (Figma 68205:83889 streamline-ultimate-color:farmers-market-kiosk-1) — 가판대 선 Depth 300 + 분홍 그라데이션 하트 · 둘레 분홍 빛(원본 흐림 효과는 아이콘 칸 밖으로 번져 잘려서 같은 색 원형 그라데이션으로) -->
<defs>
<radialGradient id="gl" cx="17.17" cy="17.4" r="8.6" gradientUnits="userSpaceOnUse"><stop stop-color="#F91F8A" stop-opacity=".75"/><stop offset=".55" stop-color="#EC50B7" stop-opacity=".35"/><stop offset="1" stop-color="#EC50B7" stop-opacity="0"/></radialGradient>
<linearGradient id="h2" x1="17.17" y1="12.66" x2="17.17" y2="20.66" gradientUnits="userSpaceOnUse"><stop stop-color="#EC50B7"/><stop offset="1" stop-color="#F91F8A"/></linearGradient>
<style>
